name: Phonon migration checks

on:
  push:
    branches:
      - phonon-migration-v3.7.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned runtime
        run: npm install --no-audit --no-fund
      - name: Vendor local runtime
        run: npm run vendor:phonon
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/voice-manager.js
          node --check sw.js
          node --check scripts/vendor-phonon.mjs
      - name: Run automated tests
        run: npm test
      - name: Confirm runtime assets exist
        run: |
          test -s vendor/phonon-tts/index.js
          test -s vendor/phonon-tts/worker.js
          test -s vendor/phonon-tts/wasm/phonon_tts_bg.wasm
          test -s vendor/phonon-tts/wasm/phonon_tts_simd_bg.wasm
          test -s vendor/phonon-tts/wasm-threads/phonon_tts_bg.wasm
          test -s vendor/phonon-tts/LICENSE-MIT
          test -s vendor/phonon-tts/LICENSE-APACHE

      - name: Commit the pinned local runtime to the migration branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/phonon-tts
          if git diff --cached --quiet; then
            echo "Vendored runtime is already up to date."
          else
            git commit -m "Vendor phonon-tts 0.4.2 runtime"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
